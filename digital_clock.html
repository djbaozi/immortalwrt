<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock - Multiple Time Zones</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(0, 0, 0, 0.8);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
        }

        .header {
            text-align: center;
            color: #00ff88;
            margin-bottom: 40px;
            font-size: 28px;
            text-shadow: 0 0 10px #00ff88;
        }

        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .clock-card {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            border: 2px solid #00ff88;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .clock-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
        }

        .timezone {
            font-size: 16px;
            color: #00ff88;
            margin-bottom: 15px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .time {
            font-size: 48px;
            color: #00ff88;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #00ff88;
            letter-spacing: 2px;
        }

        .date {
            font-size: 12px;
            color: #88ff00;
            opacity: 0.8;
        }

        .offset {
            font-size: 11px;
            color: #ffff00;
            margin-top: 10px;
            opacity: 0.7;
        }

        .controls {
            background: rgba(0, 50, 100, 0.5);
            border: 1px solid #00ff88;
            border-radius: 10px;
            padding: 20px;
            margin-top: 30px;
        }

        .controls-title {
            color: #00ff88;
            margin-bottom: 15px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .timezone-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        .timezone-input {
            flex: 1;
            min-width: 200px;
            padding: 10px;
            background: #000;
            border: 1px solid #00ff88;
            color: #00ff88;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        .timezone-input::placeholder {
            color: #00ff88;
            opacity: 0.5;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            background: #00ff88;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            font-family: 'Courier New', monospace;
        }

        button:hover {
            background: #00dd66;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        .preset-button {
            padding: 8px 15px;
            font-size: 11px;
            background: #00ff88;
            opacity: 0.7;
        }

        .preset-button:hover {
            opacity: 1;
        }

        .preset-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .remove-btn {
            background: #ff4444;
            color: white;
            padding: 5px 10px;
            font-size: 11px;
            margin-top: 10px;
        }

        .remove-btn:hover {
            background: #ff2222;
            box-shadow: 0 0 10px rgba(255, 68, 68, 0.5);
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .time {
                font-size: 36px;
            }

            .header {
                font-size: 20px;
            }

            .clocks-grid {
                grid-template-columns: 1fr;
            }
        }

        .blinking-colon::after {
            content: ':';
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 49% {
                opacity: 1;
            }
            50%, 100% {
                opacity: 0.3;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">⏰ Digital Clock - Time Zones</div>

        <div class="clocks-grid" id="clocksGrid">
            <!-- Clock cards will be dynamically inserted here -->
        </div>

        <div class="controls">
            <div class="controls-title">Add Time Zone</div>
            <div class="timezone-selector">
                <input 
                    type="text" 
                    id="timezoneInput" 
                    class="timezone-input" 
                    placeholder="e.g., America/New_York, Europe/London, Asia/Tokyo"
                >
            </div>
            <div class="button-group">
                <button onclick="addTimezone()">Add Timezone</button>
                <button onclick="resetToDefaults()">Reset to Defaults</button>
            </div>
            <div class="preset-buttons">
                <span style="color: #00ff88; font-size: 12px;">Quick Add:</span>
                <button class="preset-button" onclick="addPreset('America/New_York')">NYC</button>
                <button class="preset-button" onclick="addPreset('Europe/London')">London</button>
                <button class="preset-button" onclick="addPreset('Europe/Paris')">Paris</button>
                <button class="preset-button" onclick="addPreset('Asia/Tokyo')">Tokyo</button>
                <button class="preset-button" onclick="addPreset('Asia/Shanghai')">Shanghai</button>
                <button class="preset-button" onclick="addPreset('Australia/Sydney')">Sydney</button>
                <button class="preset-button" onclick="addPreset('Asia/Dubai')">Dubai</button>
                <button class="preset-button" onclick="addPreset('America/Los_Angeles')">LA</button>
            </div>
        </div>
    </div>

    <script>
        // Default time zones
        const defaultTimezones = [
            'America/New_York',
            'Europe/London',
            'Asia/Tokyo',
            'Australia/Sydney'
        ];

        let timezones = [...defaultTimezones];

        // Initialize the clock
        function initClock() {
            loadTimezones();
            updateClocks();
            setInterval(updateClocks, 1000);
        }

        // Load timezones from localStorage
        function loadTimezones() {
            const saved = localStorage.getItem('timezones');
            if (saved) {
                timezones = JSON.parse(saved);
            }
            renderClocks();
        }

        // Save timezones to localStorage
        function saveTimezones() {
            localStorage.setItem('timezones', JSON.stringify(timezones));
        }

        // Render clock cards
        function renderClocks() {
            const grid = document.getElementById('clocksGrid');
            grid.innerHTML = '';

            timezones.forEach((tz, index) => {
                const card = document.createElement('div');
                card.className = 'clock-card';
                card.id = `clock-${index}`;
                card.innerHTML = `
                    <div class="timezone">${tz.replace(/_/g, ' ')}</div>
                    <div class="time" id="time-${index}">--:--:--</div>
                    <div class="date" id="date-${index}">--/--/----</div>
                    <div class="offset" id="offset-${index}">UTC--</div>
                    ${timezones.length > 1 ? `<button class="remove-btn" onclick="removeTimezone(${index})">Remove</button>` : ''}
                `;
                grid.appendChild(card);
            });
        }

        // Update all clocks
        function updateClocks() {
            timezones.forEach((tz, index) => {
                const now = new Date();
                const formatter = new Intl.DateTimeFormat('en-US', {
                    timeZone: tz,
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false
                });

                const dateFormatter = new Intl.DateTimeFormat('en-US', {
                    timeZone: tz,
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit'
                });

                const timeString = formatter.format(now);
                const dateString = dateFormatter.format(now);

                // Calculate UTC offset
                const utcDate = new Date(now.toLocaleString('en-US', { timeZone: 'UTC' }));
                const tzDate = new Date(now.toLocaleString('en-US', { timeZone: tz }));
                const offset = (tzDate - utcDate) / (1000 * 60 * 60);
                const offsetSign = offset >= 0 ? '+' : '';
                const offsetStr = `UTC${offsetSign}${offset.toFixed(0)}`;

                document.getElementById(`time-${index}`).textContent = timeString;
                document.getElementById(`date-${index}`).textContent = dateString;
                document.getElementById(`offset-${index}`).textContent = offsetStr;
            });
        }

        // Add timezone
        function addTimezone() {
            const input = document.getElementById('timezoneInput');
            const tz = input.value.trim();

            if (!tz) {
                alert('Please enter a timezone');
                return;
            }

            // Validate timezone
            try {
                new Intl.DateTimeFormat('en-US', { timeZone: tz });
            } catch (e) {
                alert(`Invalid timezone: ${tz}`);
                return;
            }

            if (timezones.includes(tz)) {
                alert(`Timezone already added: ${tz}`);
                return;
            }

            timezones.push(tz);
            saveTimezones();
            renderClocks();
            input.value = '';
            updateClocks();
        }

        // Add preset timezone
        function addPreset(tz) {
            if (!timezones.includes(tz)) {
                timezones.push(tz);
                saveTimezones();
                renderClocks();
                updateClocks();
            }
        }

        // Remove timezone
        function removeTimezone(index) {
            if (timezones.length > 1) {
                timezones.splice(index, 1);
                saveTimezones();
                renderClocks();
                updateClocks();
            }
        }

        // Reset to defaults
        function resetToDefaults() {
            timezones = [...defaultTimezones];
            saveTimezones();
            renderClocks();
            updateClocks();
        }

        // Allow Enter key in input
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('timezoneInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addTimezone();
                }
            });
        });

        // Start the clock
        initClock();
    </script>
</body>
</html>
