name: Build Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev zlib1g-dev gawk git gettext libssl-dev
    - name: Update feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a
    - name: Configure and build
      run: |
        make menuconfig
        make -j$(nproc)
